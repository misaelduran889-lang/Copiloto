name: Build Copiloto APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'docs/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar la web dentro de la app
        run: cp docs/index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK de Android (el preinstalado del runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generar Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Compilar APK (debug, instalable)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Copiloto.apk

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Copiloto-APK
          path: Copiloto.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Copiloto (última versión)
          files: Copiloto.apk
