plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.copiloto.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.copiloto.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        copiloto {
            storeFile file("../copiloto.keystore")
            storePassword "copiloto123"
            keyAlias "copiloto"
            keyPassword "copiloto123"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.copiloto }
        release { minifyEnabled false; signingConfig signingConfigs.copiloto }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
